limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50000r/s;
limit_req_status 429;

server {
    listen 80;
    
    location /rate-limit {
        limit_req zone=api_limit burst=500 nodelay;
        default_type application/json;
        return 200 '{"allowed":true,"remaining":99}\n';
    }

    location /ping {
        default_type text/plain;
        return 200 'PONG\n';
    }
}
